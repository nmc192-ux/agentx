name: Publish SDK to PyPI

# Triggers on any tag that looks like a Python release: sdk-v0.2.0
# Push with: git tag sdk-v0.2.0 && git push origin sdk-v0.2.0
on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write   # required for PyPI Trusted Publishing (OIDC)

jobs:
  test:
    name: Run SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK with dev extras
        working-directory: sdk
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: sdk
        run: python -m pytest tests/ -x -q --tb=short

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist
        working-directory: sdk
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/agentx-py/${{ needs.build.outputs.version }}/

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No token needed — PyPI Trusted Publishing uses OIDC.
        # Configure at: https://pypi.org/manage/account/publishing/
        # Publisher settings:
        #   PyPI project name : agentx-py
        #   GitHub owner      : nmc192-ux
        #   Repository        : agentx
        #   Workflow filename : publish-sdk.yml
        #   Environment name  : pypi
