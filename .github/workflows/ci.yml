name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 — Backend Tests
# Platform uses Python 3.12 (see platform/pyproject.toml requires-python)
# Tests use ASGITransport + unittest.mock — no real Postgres/Redis required.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  backend-tests:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/platform
      # Minimal settings so config.py loads without errors in test env
      AGENTX_ENV: test
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentx_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-jwt-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: backend-pip-${{ runner.os }}-${{ hashFiles('platform/requirements*.txt') }}
          restore-keys: |
            backend-pip-${{ runner.os }}-

      - name: Install platform dependencies
        working-directory: platform
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend unit tests
        working-directory: platform
        run: |
          python -m pytest tests/ \
            -x -q \
            --ignore=tests/integration \
            --ignore=tests/simulation \
            -p no:warnings \
            --tb=short \
            -m "not integration and not e2e"

  # ───────────────────────────────────────────────────────────────────────────
  # Migration chain check (added Sep 2026 after the prod schema reconciliation)
  # Builds a real Postgres from the init-db.sql baseline — the same starting
  # point as production — and runs the full Alembic chain up, partly down, and
  # up again. The unit tests above mock the database, which is how the chain
  # silently broke in April; this job makes that impossible to miss again.
  # Because Deploy waits for CI, a broken migration now blocks the deploy.
  # ───────────────────────────────────────────────────────────────────────────
  migration-chain:
    name: Migration chain (real Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16   # migration 035 enables the vector extension
        env:
          POSTGRES_USER: agentx
          POSTGRES_PASSWORD: agentx
          POSTGRES_DB: agentx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentx"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: agentx
      POSTGRES_PASSWORD: agentx
      POSTGRES_DB: agentx
      POSTGRES_SSL_MODE: disable
      JWT_SECRET: ci-migration-check-secret-not-for-production-000000
      REDIS_HOST: localhost
      REDIS_PASSWORD: ci-not-used

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install platform dependencies
        working-directory: platform
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load init-db.sql baseline (same starting point as production)
        working-directory: platform
        env:
          PGPASSWORD: agentx
        run: psql -h localhost -U agentx -d agentx -v ON_ERROR_STOP=1 -q -f scripts/init-db.sql

      - name: Run full chain, roll back to 037, run forward again
        working-directory: platform
        run: |
          alembic stamp 001
          alembic upgrade head
          alembic downgrade 037
          alembic upgrade head
          alembic current

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2 — SDK Tests
  # Standalone SDK lives in sdk/ with its own pyproject.toml.
  # Tests use respx mocks — no network calls.
  # ───────────────────────────────────────────────────────────────────────────
  sdk-tests:
    name: SDK Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: sdk-pip-${{ runner.os }}-${{ hashFiles('sdk/pyproject.toml') }}
          restore-keys: |
            sdk-pip-${{ runner.os }}-

      - name: Install SDK with dev extras
        working-directory: sdk
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run SDK tests
        working-directory: sdk
        run: |
          python -m pytest tests/ -x -q --tb=short

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3 — Lint
  # Ruff on platform/src/ and sdk/agentx_sdk/ (hard fail).
  # agents/ and orchestrator/ checked but failures are reported, not blocking
  # (those dirs pre-date the ruff config and may have minor style issues).
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.8.4   # pin to match requirements-dev.txt

      - name: Lint — platform/src (blocking)
        run: ruff check platform/src/ --output-format=github

      - name: Lint — sdk/agentx_sdk (blocking)
        run: ruff check sdk/agentx_sdk/ --output-format=github

      - name: Lint — agents/ (advisory)
        run: ruff check agents/ --output-format=github --exit-zero

      - name: Lint — orchestrator/ (advisory)
        run: ruff check orchestrator/ --output-format=github --exit-zero

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3b — UI lint + build (Next.js frontend in ui/)
  # Vercel deploys ui/ itself; this job catches lint/type/build breakage first.
  # Builds with the default (all-off) feature flags; no secrets needed.
  # ───────────────────────────────────────────────────────────────────────────
  ui:
    name: UI lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4 — Docker Build (backend)
  # Verifies the platform Dockerfile builds from the repo root context.
  # Does NOT push the image.
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build (backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build platform image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/Dockerfile
          push: false
          tags: agentx-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
