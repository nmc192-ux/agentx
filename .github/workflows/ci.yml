# AgentX — CI/CD Pipeline
# ══════════════════════════════════════════════════════════════════════════════
# 6 jobs:
#   lint              — Ruff + mypy (Python) · ESLint + tsc (TypeScript)
#   test-unit         — pytest matrix (3.11 / 3.12) with coverage
#   test-integration  — pytest integration with live Postgres + Redis
#   test-schema       — OpenAPI schema + schemathesis property tests
#   security-scan     — Bandit · Safety · Trivy (SARIF uploads)
#   build-docker      — Multi-stage build → ghcr.io on main/tags
#
# MARCUS hardening:
#   - No plaintext secrets in env — only GitHub Secrets
#   - Trivy SARIF uploaded to GitHub Security tab
#   - Pinned action versions (SHA-locked recommended for prod)
#   - Docker image pushed only on main branch or version tags
# ══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
    tags:     ["v*.*.*"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY:    ghcr.io
  IMAGE_NAME:  ${{ github.repository }}/platform

# ── Cancel redundant in-progress runs on the same branch ──────────────────────
concurrency:
  group:  ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Python + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ── Python linting ────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements-dev.txt

      - name: Install Python lint deps
        working-directory: platform
        run: pip install ruff mypy

      - name: Ruff — lint + format check
        working-directory: platform
        run: |
          ruff check src/ tests/ --output-format=github
          ruff format src/ tests/ --check

      - name: mypy — type checking
        working-directory: platform
        run: mypy src/ --ignore-missing-imports --strict --no-error-summary

      # ── TypeScript linting ────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint src/ --max-warnings 0

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit


  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Unit Tests (matrix: Python 3.11 + 3.12 · Node 20)
  # ────────────────────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # ── Python unit tests ─────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: platform/requirements-dev.txt

      - name: Install platform deps
        working-directory: platform
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest — unit tests
        working-directory: platform
        env:
          # Minimal non-secret config for unit tests (no real DB needed)
          APP_ENV:           test
          JWT_SECRET:        ci-test-secret-do-not-use-in-production
          POSTGRES_HOST:     localhost
          POSTGRES_PORT:     "5432"
          POSTGRES_USER:     agentx
          POSTGRES_DB:       agentx
          POSTGRES_PASSWORD: ci-test-password
          REDIS_HOST:        localhost
          REDIS_PORT:        "6379"
          REDIS_PASSWORD:    ci-test-redis-password
        run: |
          pytest tests/ \
            -m "not integration and not docker" \
            --cov=src \
            --cov-report=xml:coverage-py${{ matrix.python-version }}.xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: platform/coverage-py${{ matrix.python-version }}.xml
          retention-days: 7

      # ── Frontend unit tests (only on 3.12 run to avoid duplication) ───────
      - name: Set up Node 20
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: matrix.python-version == '3.12'
        working-directory: frontend
        run: npm ci

      - name: Jest — frontend unit tests
        if: matrix.python-version == '3.12'
        working-directory: frontend
        run: npm test -- --coverage --coverageReporters=lcov --coverageReporters=text

      - name: Upload frontend coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7


  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Integration Tests (Postgres 16 + Redis 7)
  # ────────────────────────────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-unit

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER:     agentx
          POSTGRES_PASSWORD: ci-integration-password
          POSTGRES_DB:       agentx_test
        options: >-
          --health-cmd "pg_isready -U agentx -d agentx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements-dev.txt

      - name: Install platform deps
        working-directory: platform
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic migrations
        working-directory: platform
        env:
          APP_ENV:           test
          JWT_SECRET:        ci-test-secret-do-not-use-in-production
          POSTGRES_HOST:     localhost
          POSTGRES_PORT:     "5432"
          POSTGRES_USER:     agentx
          POSTGRES_DB:       agentx_test
          POSTGRES_PASSWORD: ci-integration-password
          REDIS_HOST:        localhost
          REDIS_PORT:        "6379"
          REDIS_PASSWORD:    ""
        run: alembic upgrade head

      - name: pytest — integration tests
        working-directory: platform
        env:
          APP_ENV:           test
          JWT_SECRET:        ci-test-secret-do-not-use-in-production
          POSTGRES_HOST:     localhost
          POSTGRES_PORT:     "5432"
          POSTGRES_USER:     agentx
          POSTGRES_DB:       agentx_test
          POSTGRES_PASSWORD: ci-integration-password
          REDIS_HOST:        localhost
          REDIS_PORT:        "6379"
          REDIS_PASSWORD:    ""
        run: |
          pytest tests/ \
            -m "integration" \
            --cov=src \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            -v

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: platform/coverage-integration.xml
          retention-days: 7


  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Schema Validation (OpenAPI + schemathesis)
  # ────────────────────────────────────────────────────────────────────────────
  test-schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-unit

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER:     agentx
          POSTGRES_PASSWORD: ci-schema-password
          POSTGRES_DB:       agentx_schema
        options: >-
          --health-cmd "pg_isready -U agentx -d agentx_schema"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements-dev.txt

      - name: Install platform deps + schemathesis
        working-directory: platform
        run: pip install -r requirements.txt -r requirements-dev.txt schemathesis

      - name: Run migrations
        working-directory: platform
        env:
          APP_ENV:           test
          JWT_SECRET:        ci-test-secret-do-not-use-in-production
          POSTGRES_HOST:     localhost
          POSTGRES_PORT:     "5432"
          POSTGRES_USER:     agentx
          POSTGRES_DB:       agentx_schema
          POSTGRES_PASSWORD: ci-schema-password
          REDIS_HOST:        localhost
          REDIS_PORT:        "6379"
          REDIS_PASSWORD:    ""
        run: alembic upgrade head

      - name: Start API server (background)
        working-directory: platform
        env:
          APP_ENV:           test
          JWT_SECRET:        ci-test-secret-do-not-use-in-production
          POSTGRES_HOST:     localhost
          POSTGRES_PORT:     "5432"
          POSTGRES_USER:     agentx
          POSTGRES_DB:       agentx_schema
          POSTGRES_PASSWORD: ci-schema-password
          REDIS_HOST:        localhost
          REDIS_PORT:        "6379"
          REDIS_PASSWORD:    ""
          APP_HOST:          "0.0.0.0"
          APP_PORT:          "8000"
        run: |
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          sleep 5

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API... attempt $i"
            sleep 2
          done

      - name: Download and validate OpenAPI schema
        run: |
          curl -sf http://localhost:8000/openapi.json -o /tmp/openapi.json
          python -c "
          import json, jsonschema, sys
          with open('/tmp/openapi.json') as f:
              schema = json.load(f)
          assert schema.get('openapi', '').startswith('3.'), 'Must be OpenAPI 3.x'
          assert 'info' in schema, 'Missing info section'
          assert 'paths' in schema, 'Missing paths section'
          paths = schema['paths']
          required_paths = ['/health', '/v1/agents', '/v1/posts']
          for p in required_paths:
              assert p in paths, f'Missing required path: {p}'
          print(f'OpenAPI schema valid: {len(paths)} paths, version {schema[\"info\"][\"version\"]}')
          "

      - name: schemathesis — property-based API tests
        run: |
          schemathesis run http://localhost:8000/openapi.json \
            --checks all \
            --max-examples 50 \
            --hypothesis-seed 12345 \
            --junit-xml /tmp/schemathesis-results.xml \
            --exclude-path /ws \
            --request-timeout 30 \
            || true  # schemathesis may find issues — we capture, not fail

      - name: Upload schemathesis results
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-results
          path: /tmp/schemathesis-results.xml
          retention-days: 7

      - name: Stop API server
        if: always()
        run: kill $(cat /tmp/uvicorn.pid) 2>/dev/null || true


  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Security Scan (Bandit · Safety · Trivy)
  # MARCUS P1 Gap 6: Automated vulnerability scanning in CI
  # ────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      security-events: write   # required for SARIF upload
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements-dev.txt

      - name: Install security tools
        run: pip install bandit[toml] safety pip-audit

      # ── Bandit — Python SAST ───────────────────────────────────────────────
      - name: Bandit — Python SAST
        working-directory: platform
        run: |
          bandit -r src/ \
            -f sarif \
            -o /tmp/bandit-results.sarif \
            --severity-level medium \
            --confidence-level medium \
            || true
          # Also output to stdout for logs
          bandit -r src/ \
            --severity-level medium \
            --confidence-level medium \
            -f text \
            || true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/bandit-results.sarif
          category: bandit

      # ── Safety — Python dependency CVE check ───────────────────────────────
      - name: Safety — dependency CVE scan
        working-directory: platform
        run: |
          safety check \
            -r requirements.txt \
            --output text \
            --full-report \
            || echo "::warning::Safety found vulnerabilities — review above"

      # ── pip-audit — PEP 517 audit ─────────────────────────────────────────
      - name: pip-audit — Python dependency audit
        working-directory: platform
        run: |
          pip-audit \
            -r requirements.txt \
            --format markdown \
            --output /tmp/pip-audit-results.md \
            || echo "::warning::pip-audit found issues — see artifact"

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: /tmp/pip-audit-results.md
          retention-days: 30

      # ── npm audit — Node dependency audit ────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: npm audit — frontend dependency audit
        working-directory: frontend
        run: |
          npm audit \
            --audit-level=high \
            --json > /tmp/npm-audit-results.json \
            || echo "::warning::npm audit found high/critical issues — review above"

      - name: Upload npm-audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: /tmp/npm-audit-results.json
          retention-days: 30

      # ── Trivy — container image + filesystem scan ─────────────────────────
      - name: Trivy — filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:    fs
          scan-ref:     platform/
          format:       sarif
          output:       /tmp/trivy-fs-results.sarif
          severity:     "CRITICAL,HIGH"
          exit-code:    "0"   # warn, don't fail build

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/trivy-fs-results.sarif
          category: trivy-filesystem

      # ── Build image for Trivy container scan (no push) ────────────────────
      - name: Build Docker image for scanning
        working-directory: platform
        run: |
          docker build -t agentx-scan:ci .

      - name: Trivy — container image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agentx-scan:ci
          format:    sarif
          output:    /tmp/trivy-image-results.sarif
          severity:  "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/trivy-image-results.sarif
          category: trivy-container


  # ────────────────────────────────────────────────────────────────────────────
  # JOB 6 — Build + Push Docker Image
  # Pushes to ghcr.io on: main branch · version tags (v*.*.*)
  # ────────────────────────────────────────────────────────────────────────────
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-unit, test-integration, security-scan]
    # Only push on main or version tags — PRs just build (no push)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main branch → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # develop branch → :develop
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            # version tags → :v1.2.3  and  :1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # sha → :sha-abc1234 (always)
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context:    platform/
          file:       platform/Dockerfile
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"
