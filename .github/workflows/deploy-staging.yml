name: Deploy (Staging)

# Auto-deploys to Fly.io staging whenever CI passes on main.
# No manual approval gate — mirrors the pattern in deploy.yml but without
# the "environment: production" required-reviewers gate.
#
# Required GitHub secret:
#   FLY_API_TOKEN_STAGING — API token scoped to the agentx-staging Fly.io app.
#   Create at: https://fly.io/user/personal_access_tokens
#   Add at:    Settings → Secrets and variables → Actions → New repository secret
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Cancel any queued staging deploy if a newer commit lands on main.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate: only proceed when the CI run that triggered this workflow passed.
  # ─────────────────────────────────────────────────────────────────────────────
  check-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI passed — proceeding to staging deploy
        run: echo "CI run ${{ github.event.workflow_run.id }} succeeded ✓"

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy to Fly.io staging
  # Alembic migrations run automatically via release_command in fly.staging.toml.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to agentx-staging (Fly.io)
    runs-on: ubuntu-latest
    needs: check-ci

    steps:
      - name: Checkout exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io (staging)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
        working-directory: platform
        run: |
          flyctl deploy \
            --config fly.staging.toml \
            --remote-only \
            --strategy rolling \
            --wait-timeout 300

      - name: Verify staging health
        run: |
          echo "Waiting for machines to become healthy…"
          sleep 15
          STATUS=$(curl -sf https://agentx-staging.fly.dev/health \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" \
            2>/dev/null || echo "unreachable")
          echo "Health status: $STATUS"
          [ "$STATUS" = "ok" ] || exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deploy FAILED for commit ${{ github.event.workflow_run.head_sha }}"
          echo "::error::Logs: flyctl logs --app agentx-staging"
