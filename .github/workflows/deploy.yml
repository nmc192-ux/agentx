name: Deploy

# Trigger only when the CI workflow succeeds on main.
# This guarantees the deploy never runs on a broken build.
#
# UI deploys are NOT handled by this workflow.
# The Next.js frontend in ui/ is deployed by Vercel's native Git integration:
#   • Pushes to main          → automatic production deploy → agentx.social
#   • Pull requests           → automatic preview deploy
# Configure environment variables (NEXT_PUBLIC_*) in the Vercel project
# settings, not here. CI on GitHub still gates that deploy via Vercel's
# "wait for CI to succeed" Git Integration option (Project → Settings → Git).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Only one deploy pipeline may run at a time.
# A new push cancels the queued staging job but never an in-flight production job.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate: only proceed if the triggering CI run actually passed
  # ─────────────────────────────────────────────────────────────────────────────
  check-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI passed — proceeding to deploy
        run: echo "CI run ${{ github.event.workflow_run.id }} succeeded ✓"

  # ─────────────────────────────────────────────────────────────────────────────
  # Staging deploy — automatic, no approval required
  # Platform: Fly.io   App: agentx-platform-staging
  # Migrations: handled by fly.staging.toml release_command = "alembic upgrade head"
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging (Fly.io)
    runs-on: ubuntu-latest
    needs: check-ci

    environment:
      name: staging
      url: https://agentx-platform-staging.fly.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io (staging)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
        working-directory: platform
        run: |
          flyctl deploy \
            --config fly.staging.toml \
            --remote-only \
            --strategy rolling \
            --wait-timeout 300

      - name: Verify staging health
        run: |
          echo "Waiting for health check…"
          sleep 15
          STATUS=$(curl -sf https://agentx-platform-staging.fly.dev/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unreachable")
          echo "Health: $STATUS"
          [ "$STATUS" = "ok" ] || exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Production backend deploy — requires manual approval via GitHub Environment
  # Platform: Fly.io   App: agentx-platform
  # Migrations: handled by fly.toml release_command = "alembic upgrade head"
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production (Fly.io)
    runs-on: ubuntu-latest
    needs: [deploy-staging]   # staging must succeed before production unlocks

    # The "production" environment enforces manual approval before this job runs.
    # Configure at: Settings → Environments → production → Required reviewers
    environment:
      name: production
      url: https://agentx-platform.fly.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io (production)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: platform
        run: |
          flyctl deploy \
            --config fly.toml \
            --remote-only \
            --strategy rolling \
            --wait-timeout 300

      - name: Verify production health
        run: |
          echo "Waiting for health check…"
          sleep 15
          STATUS=$(curl -sf https://agentx-platform.fly.dev/health \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" \
            2>/dev/null || echo "unreachable")
          echo "Health: $STATUS"
          [ "$STATUS" = "ok" ] || exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deploy FAILED for commit ${{ github.event.workflow_run.head_sha }}"
          echo "::error::Check Fly.io dashboard: https://fly.io/apps/agentx-platform"
