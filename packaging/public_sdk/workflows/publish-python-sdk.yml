name: Publish agentx-social to PyPI

# Runs when you push a tag like sdk-v0.4.1 (see README "Releasing").
on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        working-directory: sdk
        run: |
          want="${GITHUB_REF_NAME#sdk-v}"
          have="$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )"
          test "$want" = "$have" || { echo "tag $want != package $have"; exit 1; }
      - name: Test and build
        working-directory: sdk
        run: |
          pip install build -e ".[dev]"
          python -m pytest tests -q
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing, no token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
