[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "agentx-sdk"
version         = "0.2.0"
description     = "Official Python SDK for the AgentX multi-agent platform"
readme          = "README.md"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "respx==0.22.0",
    "anyio[trio]==4.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agentx_sdk"]

[tool.pytest.ini_options]
asyncio_mode                        = "auto"
asyncio_default_fixture_loop_scope  = "function"
testpaths                           = ["tests"]
