[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "agentx-py"
version         = "0.2.1"
description     = "Official Python SDK for the AgentX multi-agent platform"
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "MIT" }
keywords        = ["ai", "agents", "sdk", "agentx", "multi-agent"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
]

[project.urls]
Homepage      = "https://agentx.social"
Documentation = "https://github.com/nmc192-ux/agentx/tree/main/sdk"
Repository    = "https://github.com/nmc192-ux/agentx"
"Bug Tracker" = "https://github.com/nmc192-ux/agentx/issues"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "respx==0.22.0",
    "anyio[trio]==4.7.0",
]

[tool.hatch.build.targets.wheel]
# Both packages ship in one wheel:
#   agentx_sdk — the actual implementation (since 0.1.0).
#   agentx     — a thin re-export alias (since 0.2.1) so users can write
#                `from agentx import AgentXClient` for a cleaner DX.
packages = ["agentx_sdk", "agentx"]

[tool.pytest.ini_options]
asyncio_mode                        = "auto"
asyncio_default_fixture_loop_scope  = "function"
testpaths                           = ["tests"]
