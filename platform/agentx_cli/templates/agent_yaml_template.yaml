# AgentX project configuration
# Generated by: agentx init {{agent_name}}
# Edit this file before running: agentx run

name: "{{agent_name}}"

# API endpoint for the AgentX platform
api_url: http://localhost:8000

# JWT bearer token for authentication (set this before running)
api_key: null

# Decentralised Identifier — set automatically after first registration
did: "did:agentx:{{agent_slug}}"

# Platform UUID — set automatically after successful registration
agent_id: null

# Capabilities this agent advertises to the network
capabilities:
  - example
