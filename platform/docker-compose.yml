# AgentX Platform — docker-compose.yml
#
# Services
# ─────────
#   postgres    PostgreSQL 16 + pgvector          (backend-only network)
#   redis       Redis 7                           (backend-only network)
#   api         FastAPI backend                   (frontend + backend)
#   worker      ACP event worker                  (backend-only network)
#   ui          Next.js 16 frontend               (frontend-only network)
#   otelcol     OpenTelemetry Collector           (backend-only, opt-in)
#
# Usage
# ─────
#   cp .env.example .env
#   ./scripts/generate-tls-certs.sh
#   ./scripts/generate-dev-secrets.sh
#   docker compose up -d                          # core stack
#   docker compose --profile observability up -d  # + OTel Collector
#
# Security (MARCUS P0/P1)
# ────────────────────────
#   MARCUS P0 Gap 1: all inter-container traffic on private backend network
#   MARCUS P0 Gap 2: TLS enforced for postgres and redis connections
#   MARCUS P1 Gap 4: credentials via Docker secrets, not plain env vars

version: "3.9"

# ── Secrets ────────────────────────────────────────────────────────────────────
# dev:  read from ./secrets/*.txt  (generated by generate-dev-secrets.sh)
# prod: use  external: true        (Kubernetes Secrets / Docker Swarm)
secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

# ── Networks ───────────────────────────────────────────────────────────────────
# frontend: public-facing — only api and ui live here
# backend:  internal-only — postgres, redis, worker, otelcol never reach the internet
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ── x-otel-env: reusable OTel environment fragment ────────────────────────────
# Merged into api and worker via YAML anchors.
# OTEL_EXPORTER_OTLP_ENDPOINT points to the otelcol service.
# Set to empty string to disable tracing without restarting containers.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otelcol:4318}"
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_TRACES_SAMPLER: parentbased_always_on

services:

  # ── PostgreSQL 16 + pgvector ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./certs/postgres:/certs:ro
    secrets:
      - db_password
    environment:
      POSTGRES_USER: agentx
      POSTGRES_DB: agentx
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/certs/server.crt
        -c ssl_key_file=/certs/server.key
        -c ssl_ca_file=/certs/ca.crt
        -c log_connections=on
        -c log_disconnections=on
        -c log_statement=ddl
        -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentx -d agentx"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass devredis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devredis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: platform/Dockerfile
    restart: unless-stopped
    networks:
      - frontend
      - backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ./certs/ca.crt:/certs/ca.crt:ro
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    environment:
      <<: *otel-env
      # ── Application ──────────────────────────────────────────────────────
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: agentx-api
      # ── PostgreSQL ────────────────────────────────────────────────────────
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: agentx
      POSTGRES_DB: agentx
      POSTGRES_SSL_MODE: require
      POSTGRES_SSL_CA: /certs/ca.crt
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # ── Redis ─────────────────────────────────────────────────────────────
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://:devredis@redis:6379/0
      REDIS_TLS: "false"
      REDIS_TLS_CA: /certs/ca.crt
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      # ── Auth ──────────────────────────────────────────────────────────────
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      # ── CORS: allow UI container and local browser ─────────────────────────
      CORS_ORIGINS: '["http://localhost:3000","http://ui:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── ACP Event Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: platform/Dockerfile
    command: python workers/worker.py
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    environment:
      <<: *otel-env
      # ── Application ──────────────────────────────────────────────────────
      APP_ENV: development
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: agentx-worker
      # ── PostgreSQL ────────────────────────────────────────────────────────
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: agentx
      POSTGRES_DB: agentx
      POSTGRES_SSL_MODE: require
      POSTGRES_SSL_CA: /certs/ca.crt
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # ── Redis ─────────────────────────────────────────────────────────────
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://:devredis@redis:6379/0
      REDIS_TLS: "false"
      REDIS_TLS_CA: /certs/ca.crt
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      # ── Auth ──────────────────────────────────────────────────────────────
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      API_BASE: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import os; from redis import Redis; Redis.from_url(os.environ['REDIS_URL'], decode_responses=True).ping()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Next.js UI ───────────────────────────────────────────────────────────────
  # Builds the Next.js app and serves it with `next start`.
  # Uses the standalone output mode (set in ui/next.config.ts) for a lean image.
  # Build args are baked in at image build time; to change API URL, rebuild.
  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}"
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Runtime env vars (not baked into the build)
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # Next.js build + startup takes ~30-60s

  # ── OpenTelemetry Collector ─────────────────────────────────────────────────
  # Opt-in: started only when the `observability` profile is requested.
  #
  #   docker compose --profile observability up -d
  #
  # Receives OTLP traces from api and worker, processes them, and exports
  # to stdout in dev. Swap exporters in observability/otelcol-config.yml
  # to send to Jaeger, Grafana Tempo, or any OTLP-compatible backend.
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.105.0
    restart: unless-stopped
    profiles: [observability]
    networks:
      - backend
    ports:
      - "127.0.0.1:4317:4317"    # OTLP gRPC  (api + worker → collector)
      - "127.0.0.1:4318:4318"    # OTLP HTTP  (api + worker → collector)
      - "127.0.0.1:13133:13133"  # health_check extension
    volumes:
      - ./observability/otelcol-config.yml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
