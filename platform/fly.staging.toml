# AgentX Platform — Fly.io Staging Configuration
# ══════════════════════════════════════════════════
#
# Provision the app once (run from platform/ directory):
#   fly apps create agentx-staging
#   fly deploy --config fly.staging.toml
#
# Three secrets must be set before the first deploy:
#
#   fly secrets set -a agentx-staging \
#     DATABASE_URL="postgres://<user>:<pass>@<host>:<port>/<db>?sslmode=require" \
#     REDIS_URL="rediss://:<password>@<host>:<port>"                             \
#     JWT_SECRET_KEY="$(openssl rand -hex 64)"
#
# DATABASE_URL  — full Postgres connection string (Neon, Fly Postgres, etc.)
# REDIS_URL     — full Redis/Upstash URL; rediss:// for TLS (port 6380)
# JWT_SECRET_KEY — 256-bit random secret used to sign access + refresh tokens
#
# All other config lives in [env] below — no secrets there.

app            = "agentx-platform-staging"
primary_region = "iad"

# ── Release command ────────────────────────────────────────────────────────────
# Runs inside the new machine BEFORE traffic is shifted to it.
# Aborts the deploy (old machines keep serving) if the migration fails.
release_command = "alembic upgrade head"

# ── Build ──────────────────────────────────────────────────────────────────────
[build]
  dockerfile = "Dockerfile"

# ── Non-secret environment ─────────────────────────────────────────────────────
[env]
  APP_ENV   = "staging"
  APP_HOST  = "0.0.0.0"
  APP_PORT  = "8000"
  LOG_LEVEL = "debug"

  # ── PostgreSQL (Neon staging branch) ──────────────────────────────────────
  POSTGRES_HOST     = "ep-divine-art-anvf2xo4-pooler.c-6.us-east-1.aws.neon.tech"
  POSTGRES_PORT     = "5432"
  POSTGRES_USER     = "neondb_owner"
  POSTGRES_DB       = "neondb"
  POSTGRES_SSL_MODE = "require"

  # ── Redis (Upstash agentx-cache) ──────────────────────────────────────────
  REDIS_HOST = "vast-jay-35806.upstash.io"
  REDIS_PORT = "6379"
  REDIS_TLS  = "true"

  # ── JWT token lifetimes ────────────────────────────────────────────────────
  JWT_ACCESS_TOKEN_TTL  = "900"
  JWT_REFRESH_TOKEN_TTL = "604800"

  # ── CORS ──────────────────────────────────────────────────────────────────
  CORS_ORIGINS = '["https://agentx-staging.vercel.app"]'

  # ── Redis key namespace (prevents staging/prod bleed on shared Upstash) ────
  REDIS_KEY_PREFIX = "stg:"

  # ── Rate limits ───────────────────────────────────────────────────────────
  RATE_LIMIT_DEFAULT  = "100/minute"
  RATE_LIMIT_AUTH     = "10/minute"
  RATE_LIMIT_DEFERRED = "10/minute"

# ── Service ────────────────────────────────────────────────────────────────────
[[services]]
  internal_port = 8000
  protocol      = "tcp"

  # Redirect plain HTTP → HTTPS
  [[services.ports]]
    port        = 80
    handlers    = ["http"]
    force_https = true

  # HTTPS with automatic TLS termination at the Fly edge
  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  # Liveness check — marks the machine unhealthy if /health stops responding
  [[services.http_checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "GET"
    path         = "/health"
    protocol     = "http"

# ── Machine sizing — single shared-cpu-1x, 512 MB ─────────────────────────────
[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
  count  = 1
