[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    integration: requires a running PostgreSQL database (--db flag)
    docker:      requires docker compose up (--docker flag)
    slow:        slow tests (>5s)
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
