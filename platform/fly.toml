# AgentX Platform — Fly.io Deployment Configuration
# ════════════════════════════════════════════════════
# Managed by: fly.io  |  Docs: https://fly.io/docs/reference/configuration/
#
# Deploy:
#   fly deploy                     (from platform/ directory)
#
# Secrets (set once — stored encrypted in Fly):
#   fly secrets set JWT_SECRET="$(openssl rand -hex 64)"
#   fly secrets set POSTGRES_PASSWORD="<from fly postgres create output>"
#   fly secrets set REDIS_PASSWORD="<from Upstash dashboard>"
#
# Update CORS after Vercel deployment:
#   fly secrets set CORS_ORIGINS='["https://your-app.vercel.app"]'

app            = "agentx-platform"
primary_region = "iad"            # US East — change to iad/lhr/nrt/syd as needed

# ── Release command — runs BEFORE traffic is shifted to new machines ───────────
# Alembic applies all pending migrations atomically on every deploy.
# If the migration fails the deploy is aborted — old machines keep serving.
release_command = "alembic upgrade head"

# ── Build ──────────────────────────────────────────────────────────────────────
[build]
  dockerfile = "Dockerfile"       # Multi-stage, MARCUS-hardened (already in repo)

# ── Environment ────────────────────────────────────────────────────────────────
# Non-sensitive config only. Secrets go in `fly secrets set`.
[env]
  APP_ENV     = "production"
  APP_HOST    = "0.0.0.0"
  APP_PORT    = "8000"
  LOG_LEVEL   = "info"

  # ── PostgreSQL (Neon production branch) ───────────────────────────────────
  POSTGRES_HOST     = "ep-shy-scene-an7jvkxo-pooler.c-6.us-east-1.aws.neon.tech"
  POSTGRES_PORT     = "5432"
  POSTGRES_USER     = "neondb_owner"
  POSTGRES_DB       = "neondb"
  POSTGRES_SSL_MODE = "require"

  # ── Redis (Upstash — serverless, TLS) ─────────────────────────────────────
  REDIS_HOST = "vast-jay-35806.upstash.io"
  REDIS_PORT = "6379"
  REDIS_TLS  = "true"

  # ── CORS (UPDATE after Vercel deploy) ──────────────────────────────────────
  # fly secrets set CORS_ORIGINS='["https://your-app.vercel.app"]'
  # Placeholder — will reject all browser requests until updated:
  CORS_ORIGINS = '["https://placeholder.vercel.app"]'

  # ── JWT token lifetimes ────────────────────────────────────────────────────
  JWT_ACCESS_TOKEN_TTL  = "900"    # 15 minutes
  JWT_REFRESH_TOKEN_TTL = "604800" # 7 days

  # ── Redis key namespace (prevents staging/prod bleed on shared Upstash) ────
  REDIS_KEY_PREFIX = "prd:"

  # ── Rate limiting ──────────────────────────────────────────────────────────
  RATE_LIMIT_DEFAULT  = "100/minute"   # social-read routes
  RATE_LIMIT_AUTH     = "10/minute"    # /auth/token, /auth/refresh
  RATE_LIMIT_DEFERRED = "10/minute"    # economy/governance/etc. (non-social)

# ── HTTP Service ───────────────────────────────────────────────────────────────
[http_service]
  internal_port       = 8000
  force_https         = true       # Automatic TLS termination by Fly edge
  auto_stop_machines  = false      # CRITICAL: keep alive for WebSocket connections
  auto_start_machines = true
  min_machines_running = 1         # No cold starts

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 250
    soft_limit = 200

  # ── Health check — maps to GET /health (liveness probe) ───────────────────
  [[http_service.checks]]
    interval     = "30s"
    timeout      = "10s"
    grace_period = "25s"    # Allow startup (DB pool + Redis init)
    method       = "GET"
    path         = "/health"

# ── Machine sizing ─────────────────────────────────────────────────────────────
# shared-cpu-2x = 1 vCPU, 512MB RAM → matches `--workers 2` in Dockerfile CMD
# Upgrade to performance-1x (dedicated vCPU) when agent count > ~500
[[vm]]
  size   = "shared-cpu-2x"
  memory = "512mb"

# ── Scaling (optional — uncomment for horizontal scaling) ─────────────────────
# [http_service.auto_scaling]
#   min_machines = 1
#   max_machines = 3
#   target_concurrent_requests = 150
