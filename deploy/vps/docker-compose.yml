# AgentX on the VPS — Sprint 16 (files only; nothing here runs until DrJ starts it).
# Plan: platform/docs/execution/vps_migration_plan.md §3. Spec: sprints/sprint_16_vps_prep.md.
#
# Lives on the VPS as /opt/agentx/docker-compose.yml next to settings.env and compose.env
# (copied from compose.env.example and filled in). Secrets live in /etc/agentx/api.env.
#
#   docker compose --env-file compose.env --profile migrate run --rm migrate   # alembic upgrade head
#   docker compose --env-file compose.env up -d api-1 api-2                    # the two API workers
#   docker compose --env-file compose.env --profile scheduler up -d scheduler  # ONLY when Fly's is stopped
#   docker compose --env-file compose.env --profile db up -d db                # own Postgres (DB-1)
#
# Database (early launch, EL-3): the API, scheduler and migrate use the `db` container from the
# start. compose.env says AGENTX_DB_ENV=/etc/agentx/db.env; that file is loaded last, so its
# POSTGRES_HOST=db / user / password win, and the same file creates the `db` container's
# superuser. Left empty, the apps get no database password and refuse to start (fail closed).
#
# Rules pinned by platform/tests/infrastructure/test_vps_deploy_files.py:
#   - nothing is published on the host: only Caddy, on ${PROXY_NETWORK} (agentx_edge, shared by
#     Caddy and AgentX only; deploy.sh checks that), can reach the API;
#   - forwarded headers are trusted from ${PROXY_SUBNET} only, never "*";
#   - scheduler and migrate never start on a plain `up` (profiles), so there is never a
#     second scheduler by accident (plan §5);
#   - db is on the private network only (not the proxy network Caddy is on), publishes no
#     port, and never sees api.env (no JWT secret in the database container).

name: agentx

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app: &app
  image: "${AGENTX_IMAGE:?set AGENTX_IMAGE in compose.env}:${IMAGE_TAG:?set IMAGE_TAG (git commit)}"
  env_file:
    - path: ./settings.env
    - path: "${AGENTX_SECRETS_FILE:-/etc/agentx/api.env}"
    # The VPS `db` container's settings and password (/etc/agentx/db.env via compose.env).
    - path: "${AGENTX_DB_ENV:-/dev/null}"
  restart: unless-stopped
  mem_limit: 512m
  logging: *logging
  networks:
    - agentx

x-api: &api
  <<: *app
  environment:
    FORWARDED_ALLOW_IPS: "${PROXY_SUBNET:?set PROXY_SUBNET (subnet of the proxy network)}"
  # Refuse to start with a wildcard or empty trust list instead of trusting everyone.
  command:
    - sh
    - -c
    - >-
      case "$$FORWARDED_ALLOW_IPS" in
      ""|*"*"*|*0.0.0.0/0*|*::/0*) echo "refusing to start: FORWARDED_ALLOW_IPS must be the proxy subnet" >&2; exit 1;;
      esac;
      exec uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 1
      --proxy-headers --forwarded-allow-ips="$$FORWARDED_ALLOW_IPS"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
    interval: 15s
    timeout: 10s
    start_period: 25s
    retries: 3
  networks:
    - agentx
    - proxy

services:
  api-1:
    <<: *api

  api-2:
    <<: *api

  scheduler:
    <<: *app
    profiles: ["scheduler"]
    command: ["python", "-m", "src.jobs.scheduler"]
    # TF-3: the small JSON records deploy.sh, db_move.sh, smoke.sh and the deploy workflow leave
    # for the founders BRUNO and QUINN. Read-only, and only here: the API never needs them.
    volumes:
      - "${AGENTX_STATUS_DIR:-/opt/agentx/status}:/var/lib/agentx/status:ro"
    healthcheck:
      disable: true

  migrate:
    <<: *app
    profiles: ["migrate"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true

  db:
    image: "pgvector/pgvector:pg17"
    profiles: ["db"]
    env_file:
      - path: "${AGENTX_DB_SECRETS_FILE:-/etc/agentx/db.env}"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging
    networks:
      - agentx

volumes:
  pgdata:
    name: agentx_pgdata

networks:
  agentx:
    name: agentx_private
  proxy:
    name: "${PROXY_NETWORK:?set PROXY_NETWORK (agentx_edge: Caddy and AgentX only, H29)}"
    external: true
